openapi: 3.0.3
info:
  title: Blast Ecom API
  version: 0.1.0
  description: Blast Ecom commerce API. Payments are local simulations or Stripe sandbox
    only.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: v1_auth_csrf_retrieve
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
          description: ''
  /api/v1/auth/email-verification/:
    post:
      operationId: v1_auth_email_verification_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequested'
          description: ''
  /api/v1/auth/email-verification/confirm/:
    post:
      operationId: v1_auth_email_verification_confirm_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResult'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/auth/email-verification/request/:
    post:
      operationId: v1_auth_email_verification_request_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequested'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequested'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequested'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      parameters:
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequested'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/categories/:
    get:
      operationId: v1_categories_list
      parameters:
      - name: page
        required: false
        in: query
        description: Page number in the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page (maximum 100).
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/orders/:
    get:
      operationId: orders_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
          enum:
          - awaiting_payment
          - cancelled
          - confirmed
          - expired
          - failed
          - payment_processing
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListPage'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
    post:
      operationId: orders_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: A UUIDv4 key scoped to this customer and operation.
        required: true
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOperationResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/orders/{order_id}/:
    get:
      operationId: orders_retrieve
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/orders/{order_id}/cancel/:
    post:
      operationId: orders_cancel
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: A UUIDv4 key scoped to this customer and operation.
        required: true
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOperationResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/orders/{order_id}/payment/:
    post:
      operationId: orders_start_payment
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: A UUIDv4 key scoped to this customer and operation.
        required: true
      - in: header
        name: X-CSRFToken
        schema:
          type: string
        description: Django CSRF token obtained from /api/v1/auth/csrf/.
        required: true
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOperationResponse'
          description: ''
        '503':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/products/:
    get:
      operationId: v1_products_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          format: uuid
        description: Filter by category UUID.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -price
          - -title
          - price
          - title
        description: Order by title or price; prefixes '-' for descending order.
      - name: page
        required: false
        in: query
        description: Page number in the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page (maximum 100).
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
  /api/v1/products/{id}/:
    get:
      operationId: v1_products_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: ''
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified:
          type: boolean
      required:
      - email
      - email_verified
      - id
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
      required:
      - id
      - name
      - slug
    CreateOrderRequest:
      type: object
      description: Reject unknown input fields instead of silently ignoring attempted
        overrides.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineInput'
          maxItems: 50
        delivery_address:
          $ref: '#/components/schemas/DeliveryAddressInput'
      required:
      - delivery_address
      - items
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    DeliveryAddressInput:
      type: object
      description: Reject unknown input fields instead of silently ignoring attempted
        overrides.
      properties:
        recipient:
          type: string
          maxLength: 160
        address_line_1:
          type: string
          maxLength: 200
        address_line_2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 120
        region:
          type: string
          maxLength: 120
        postal_code:
          type: string
          maxLength: 32
        country_code:
          type: string
          maxLength: 2
          pattern: ^[A-Z]{2}$
      required:
      - address_line_1
      - city
      - country_code
      - recipient
    EmailVerificationConfirm:
      type: object
      description: Reject unknown input fields instead of silently ignoring attempted
        overrides.
      properties:
        token:
          type: string
          writeOnly: true
          maxLength: 2048
      required:
      - token
    EmailVerificationResult:
      type: object
      properties:
        verified:
          type: boolean
      required:
      - verified
    LoginRequest:
      type: object
      description: Reject unknown input fields instead of silently ignoring attempted
        overrides.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - email
      - password
    OrderDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
        currency:
          type: string
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        shipping_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        delivery_address:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        payment_provider:
          type: string
          readOnly: true
        payment:
          type: object
          additionalProperties:
            type: string
          nullable: true
          readOnly: true
      required:
      - created_at
      - currency
      - delivery_address
      - expires_at
      - id
      - items
      - payment
      - payment_provider
      - shipping_total
      - state
      - subtotal
      - total
      - updated_at
    OrderItemResponse:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 32767
          minimum: 0
        line_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - line_total
      - product_id
      - quantity
      - sku
      - title
      - unit_price
    OrderLineInput:
      type: object
      description: Reject unknown input fields instead of silently ignoring attempted
        overrides.
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          maximum: 99
          minimum: 1
        expected_unit_price:
          type: string
          maxLength: 13
          pattern: ^(?:0|[1-9]\d{0,9})\.\d{2}$
      required:
      - expected_unit_price
      - product_id
      - quantity
    OrderListPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrderOperationResponse'
      required:
      - count
      - next
      - previous
      - results
    OrderOperationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
        currency:
          type: string
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        shipping_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
      required:
      - created_at
      - currency
      - expires_at
      - id
      - items
      - shipping_total
      - state
      - subtotal
      - total
      - updated_at
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedProductList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    PasswordResetConfirm:
      type: object
      description: Reject unknown input fields instead of silently ignoring attempted
        overrides.
      properties:
